- type: entity
  id: FireRedArcade
  parent: DoomArcade
  name: FireRed arcade
  components:
  - type: UserInterface
    interfaces:
      enum.DoomArcadeUiKey.Key:
        type: FireRedArcadeBoundUserInterface
      enum.WiresUiKey.Key:
        type: WiresBoundUserInterface
  - type: Computer
    board: FireRedArcadeComputerCircuitboard

- type: entity
  id: FireRedArcadeComputerCircuitboard
  parent: BaseComputerCircuitboard
  name: FireRed arcade board
  components:
  - type: ComputerBoard
    prototype: FireRedArcade

